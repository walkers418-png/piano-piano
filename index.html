<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17843A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Piano Piano">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Piano Piano</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: sticky stat bar, a winding lesson path in colored sections, full-screen lessons with a fixed answer bar.
   Chunky "pressable" controls: thick bottom edge that collapses on press. Mascot: Lumi the snail ("piano piano" = little by little). */
:root{
  --bg:#FBFCFA; --surface:#FFFFFF; --soft:#F1F4EF; --line:#DDE3D9; --ink:#25332A; --muted:#66756A;
  --lock:#E3E7E0; --lock-e:#C9D0C5; --on:#FFFFFF;
  --green:#17843A; --green-e:#0F5F29; --green-s:#DFF3E4;
  --blue:#1D74D6; --blue-e:#14529A; --blue-s:#DDEBFB;
  --purple:#7B4FD8; --purple-e:#5632A8; --purple-s:#ECE5FA;
  --gold:#FFB81C; --gold-e:#D4920A; --gold-s:#FFF0C9;
  --red:#D93A30; --red-e:#A8261E; --red-s:#FFE3E0;
  --font:'Nunito','M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121C16; --surface:#1A271F; --soft:#22332A; --line:#2F4437; --ink:#E9F3EC; --muted:#9BB1A2;
    --lock:#2A3A31; --lock-e:#1D2A23; --on:#0A1710;
    --green:#4CD06B; --green-e:#2C9A47; --green-s:#1B3A27;
    --blue:#5AA9FF; --blue-e:#2F78C8; --blue-s:#1B3047;
    --purple:#AE92FF; --purple-e:#7A5CD1; --purple-s:#2C2547;
    --gold:#FFC83D; --gold-e:#C99512; --gold-s:#3F3513;
    --red:#FF7066; --red-e:#C9453B; --red-s:#432120;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121C16; --surface:#1A271F; --soft:#22332A; --line:#2F4437; --ink:#E9F3EC; --muted:#9BB1A2;
  --lock:#2A3A31; --lock-e:#1D2A23; --on:#0A1710;
  --green:#4CD06B; --green-e:#2C9A47; --green-s:#1B3A27;
  --blue:#5AA9FF; --blue-e:#2F78C8; --blue-s:#1B3047;
  --purple:#AE92FF; --purple-e:#7A5CD1; --purple-s:#2C2547;
  --gold:#FFC83D; --gold-e:#C99512; --gold-s:#3F3513;
  --red:#FF7066; --red-e:#C9453B; --red-s:#432120;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;font-weight:600;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3,p{margin:0}
h2{font-size:24px;font-weight:800;line-height:1.3;text-wrap:balance}
.cap{font-size:14px;color:var(--muted)}
#app{max-width:560px;margin:0 auto;padding-block:0 110px}
svg.i{width:1em;height:1em;fill:currentColor;flex:none}

/* ---- pressable buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 22px;border-radius:16px;
  font-weight:800;font-size:16px;letter-spacing:.04em;background:var(--surface);color:var(--blue);border:2px solid var(--line);border-bottom-width:5px;
  text-transform:none;transition:transform .05s}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.btn.full{width:100%}
.btn.green{background:var(--green);border-color:var(--green-e);color:var(--on)}
.btn.blue{background:var(--blue);border-color:var(--blue-e);color:var(--on)}
.btn.red{background:var(--red);border-color:var(--red-e);color:var(--on)}
.btn.off,.btn:disabled{background:var(--lock);border-color:var(--lock-e);color:var(--muted)}
.btn.sm{min-height:42px;padding:8px 16px;font-size:14px}
.btn.quiet{background:transparent;border-color:transparent;border-bottom-width:2px;color:var(--muted)}

/* ---- stat bar ---- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0}
.pill{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px;padding:4px 6px;border-radius:12px;font-variant-numeric:tabular-nums}
.pill svg{font-size:24px}
.pill.fire{color:#E8730C}.pill.xp{color:var(--gold-e)}.pill.heart{color:var(--red)}.pill.gem{color:var(--blue)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.fire{color:#FFA24D}:root:not([data-theme="light"]) .pill.xp{color:var(--gold)}}
:root[data-theme="dark"] .pill.fire{color:#FFA24D}:root[data-theme="dark"] .pill.xp{color:var(--gold)}
.goal{flex:1;min-width:0;max-width:200px}
.goal .t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:800}
.meter{height:12px;border-radius:99px;background:var(--lock);overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .3s}

/* ---- path ---- */
.secban{display:flex;align-items:center;gap:12px;justify-content:space-between;border-radius:18px;padding:14px 16px;color:var(--on);border-bottom:5px solid;margin-top:20px}
.secban.c0{background:var(--green);border-color:var(--green-e)}
.secban.c1{background:var(--blue);border-color:var(--blue-e)}
.secban.c2{background:var(--purple);border-color:var(--purple-e)}
.secban small{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.85}
.secban b{font-size:19px;font-weight:800;line-height:1.3;display:block}
.secban .sub{font-size:13px;opacity:.92;font-weight:600}
.secban .guide{flex:none;width:48px;height:48px;border-radius:14px;border:2px solid rgba(255,255,255,.55);border-bottom-width:4px;background:rgba(255,255,255,.18);color:inherit;display:grid;place-items:center;font-size:24px}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 0 8px}
.nw{display:flex;flex-direction:column;align-items:center;position:relative;width:140px}
.node{width:78px;height:72px;border-radius:50%;border:0;display:grid;place-items:center;font-size:32px;position:relative;transition:transform .05s,box-shadow .05s;margin-bottom:8px}
.node.c0{background:var(--green);box-shadow:0 8px 0 var(--green-e);color:var(--on)}
.node.c1{background:var(--blue);box-shadow:0 8px 0 var(--blue-e);color:var(--on)}
.node.c2{background:var(--purple);box-shadow:0 8px 0 var(--purple-e);color:var(--on)}
.node.done{background:var(--gold);box-shadow:0 8px 0 var(--gold-e);color:#5A3D00}
.node.lock{background:var(--lock);box-shadow:0 8px 0 var(--lock-e);color:var(--muted)}
.node:active:not(:disabled){transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.nw .lbl{font-size:12px;color:var(--muted);text-align:center;line-height:1.3;max-width:140px;overflow-wrap:anywhere;font-weight:700}
.nw.cur .lbl{color:var(--ink)}
.startb{position:absolute;top:-40px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--green);border:2px solid var(--line);border-radius:12px;padding:3px 12px;font-weight:800;font-size:14px;letter-spacing:.06em;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.startb::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.startb{animation:none}}
.mascot-row{display:flex;justify-content:center;padding:18px 0 4px}
.lumi{width:120px;height:auto}

/* ---- screens with titles ---- */
.title{padding:18px 0 10px;display:flex;align-items:center;gap:12px}
.title .lumi{width:64px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface)}
.stat b{display:flex;align-items:center;gap:6px;font-size:24px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums}
.stat small{font-size:13px;color:var(--muted);font-weight:700}
.sectitle{font-size:14px;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:24px 0 10px}

/* ---- verb list ---- */
.search{width:100%;font:inherit;font-weight:700;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:6px 14px;min-height:38px;font-weight:800;font-size:14px;color:var(--muted)}
.chip.on{border-color:var(--blue);background:var(--blue-s);color:var(--blue)}
.vrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:10px 14px}
.vrow:active{transform:translateY(2px);border-bottom-width:2px}
.vrow .a{flex:1;min-width:0;line-height:1.35}
.vrow b{font-size:19px;font-weight:800;display:block}
.vrow small{color:var(--muted);font-size:13px}
.tag{font-size:11px;font-weight:800;letter-spacing:.04em;padding:2px 8px;border-radius:8px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.irr{background:var(--gold-s);color:var(--gold-e)}
.str{display:flex;gap:3px}
.str i{width:7px;height:16px;border-radius:3px;background:var(--lock)}
.str i.on{background:var(--gold)}

/* ---- verb card (table) ---- */
.vcard{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px}
.vhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.vhead .a{flex:1;min-width:0}
.vhead b{font-size:26px;font-weight:900;line-height:1.2;display:block}
.vhead small{color:var(--muted);font-size:14px}
.forms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.form{display:flex;flex-direction:column;text-align:left;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:6px 12px;min-height:56px}
.form:active{transform:translateY(2px);border-bottom-width:2px}
.form small{font-size:12px;color:var(--muted);font-weight:700}
.form b{font-size:19px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.exline{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--soft);border-radius:12px;padding:10px 12px}
.exline .a{flex:1;min-width:0}
.exline b{display:block;font-weight:800}
.exline small{color:var(--muted)}
.spk{flex:none;width:44px;height:44px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--blue);display:grid;place-items:center;font-size:22px}
.spk:active{transform:translateY(2px);border-bottom-width:2px}
.spk.big{width:72px;height:72px;border-radius:20px;background:var(--blue);border-color:var(--blue-e);color:var(--on);font-size:36px}

/* ---- lesson frame ---- */
.ltop{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);display:flex;align-items:center;gap:14px;padding:14px 0 10px}
.ltop .x{flex:none;font-size:30px;color:var(--muted);background:none;border:0;width:40px;height:40px;display:grid;place-items:center}
.prog{flex:1;height:16px;border-radius:99px;background:var(--lock);overflow:hidden;position:relative}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s;position:relative}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
.ltop .pill.heart{font-size:18px}
.lbody{padding:10px 0 220px}
.ask{font-size:22px;font-weight:800;line-height:1.35;margin:6px 0 18px;text-wrap:balance}
.say{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.say .lumi{width:84px;flex:none}
.bubble{position:relative;flex:1;min-width:0;border:2px solid var(--line);border-radius:18px;padding:12px 14px;background:var(--surface);display:flex;gap:12px;align-items:center;margin-top:6px}
.bubble::before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .t{flex:1;min-width:0;font-size:19px;font-weight:800;line-height:1.4;overflow-wrap:anywhere}
.bubble .t small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.bubble .spk{width:40px;height:40px;font-size:20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:58px;padding:10px 16px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);font-size:18px;font-weight:800;line-height:1.35}
.opt:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.opt.sel{border-color:var(--blue);background:var(--blue-s);color:var(--blue)}
.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-s);color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-s);color:var(--red)}
.opt:disabled{opacity:1}

.sent{font-size:22px;font-weight:800;line-height:2.1;margin-bottom:18px}
.slot{display:inline-block;min-width:96px;border-bottom:3px solid var(--line);text-align:center;padding:0 8px;margin:0 4px;color:var(--blue)}
.slot.right{color:var(--green);border-color:var(--green)}
.slot.wrong{color:var(--red);border-color:var(--red)}
.ans{min-height:76px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px 0;border-top:2px solid var(--line);border-bottom:2px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 53px,var(--line) 53px,var(--line) 55px);margin-bottom:22px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{padding:8px 16px;min-height:46px;border-radius:14px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);font-size:18px;font-weight:800}
.tile:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.tile.ghost{background:var(--lock);border-color:var(--lock);color:transparent;border-bottom-width:2px;pointer-events:none}
.field{width:100%;font:inherit;font-weight:800;font-size:21px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--soft);color:var(--ink)}
.accents{display:flex;gap:8px;margin:10px 0}
.accents button{min-width:46px;height:46px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-size:20px;font-weight:800}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt .col{display:flex;flex-direction:column;gap:10px}
.mt .opt{min-height:64px;font-size:16px;justify-content:center;text-align:center}
.mt .opt.done{opacity:.35;pointer-events:none}
.mt .opt.bad{border-color:var(--red);background:var(--red-s);color:var(--red)}
.pronoun{display:inline-block;background:var(--blue-s);color:var(--blue);border-radius:10px;padding:0 10px;margin-right:6px}

/* ---- answer bar ---- */
.abar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:2px solid var(--line);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.abar .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.abar.right{background:var(--green-s);border-color:var(--green-s)}
.abar.wrong{background:var(--red-s);border-color:var(--red-s)}
.fb{display:flex;align-items:center;gap:12px}
.fb .ic{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;color:var(--on)}
.abar.right .ic{background:var(--green)}.abar.wrong .ic{background:var(--red)}
.fb .tx{flex:1;min-width:0}
.fb b{display:block;font-size:20px;font-weight:900;line-height:1.3}
.abar.right b{color:var(--green)}.abar.wrong b{color:var(--red)}
.fb .tx div{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.abar.right .tx div{color:var(--green)}.abar.wrong .tx div{color:var(--red)}
.abar .spk{background:transparent;border-color:currentColor}
.abar.right .spk{color:var(--green)}.abar.wrong .spk{color:var(--red)}

/* ---- intro / result ---- */
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:30px}
.center .lumi{width:150px}
.big{font-size:30px;font-weight:900;line-height:1.3;text-wrap:balance}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.rc{border:2px solid;border-radius:16px;overflow:hidden;background:var(--surface)}
.rc .h{font-size:12px;font-weight:900;letter-spacing:.08em;padding:4px;color:var(--on)}
.rc .v{padding:12px 4px;font-size:22px;font-weight:900;display:flex;gap:6px;justify-content:center;align-items:center}
.rc.xp{border-color:var(--gold)}.rc.xp .h{background:var(--gold);color:#5A3D00}.rc.xp .v{color:var(--gold-e)}
.rc.ac{border-color:var(--green)}.rc.ac .h{background:var(--green)}.rc.ac .v{color:var(--green)}
.rc.st{border-color:#E8730C}.rc.st .h{background:#E8730C;color:#fff}.rc.st .v{color:#E8730C}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:2px solid var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bottom .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.tip{background:var(--gold-s);border:2px solid var(--gold);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.7}
.etable{width:100%;border-collapse:collapse;font-size:16px}
.etable th,.etable td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.etable th{font-size:13px;color:var(--muted)}
.etable td b{font-weight:900}
.scroll-x{overflow-x:auto}


/* ---- phrasebook ---- */
.chips.row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips.row .chip{flex:none}
.prow{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px}
.prow .a{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow b{font-size:18px;font-weight:800;line-height:1.4;overflow-wrap:anywhere}
.prow .ja{font-size:15px;line-height:1.5}
.prow small{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.5}
.prow .side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.rt{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;padding:2px 8px;border-radius:8px;white-space:nowrap}
.rt.f{background:var(--blue-s);color:var(--blue)}
.rt.n{background:var(--green-s);color:var(--green)}
.rt.i{background:var(--gold-s);color:var(--gold-e)}
.rt.s{background:var(--purple-s);color:var(--purple)}

function conjugate(inf){
  if(IRR[inf])return {f:IRR[inf],type:'irr'};
  const refl=inf.endsWith('rsi');
  const base=refl?inf.replace(/rsi$/,'re'):inf;
  const kind=base.slice(-3),stem=base.slice(0,-3);
  let f,type;
  if(kind==='are'){
    type='are';
    if(stem.endsWith('i')){const b=stem.slice(0,-1);f=[b+'io',b+'i',b+'ia',b+'iamo',b+'iate',b+'iano'];}
    else if(/[cg]$/.test(stem)){f=[stem+'o',stem+'hi',stem+'a',stem+'hiamo',stem+'ate',stem+'ano'];}
    else f=[stem+'o',stem+'i',stem+'a',stem+'iamo',stem+'ate',stem+'ano'];
  }else if(kind==='ere'){type='ere';f=[stem+'o',stem+'i',stem+'e',stem+'iamo',stem+'ete',stem+'ono'];}
  else if(ISC.includes(base)){type='isc';f=[stem+'isco',stem+'isci',stem+'isce',stem+'iamo',stem+'ite',stem+'iscono'];}
  else{type='ire';f=[stem+'o',stem+'i',stem+'e',stem+'iamo',stem+'ite',stem+'ono'];}
  return {f,type:refl?'refl':type};
}

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith('it'));}catch(e){voices=[];}}
try{loadVoices();speechSynthesis.addEventListener('voiceschanged',()=>{loadVoices();if(view==='me')render();});}catch(e){}
function say(text,slow){

    const v=voices.find(x=>x.name===S.settings.voice)||voices[0];if(v)u.voice=v;

}

/* ---------- 問題の生成 ---------- */
const mk=(type,v,x)=>Object.assign({type,v,state:'idle'},x||{});
function blankIndex(v){
  const set=v.f.map(norm),t=v.ex.split(' ');
  for(let i=0;i<t.length;i++)if(set.includes(norm(core(t[i]))))return i;
  return -1;
}
function genLesson(verbs){
  const out=[];
  shuffle(verbs).forEach((v,i)=>out.push(mk('meaning',v,{dir:i%2})));
  if(verbs.length>=2)out.push(mk('match',null,{verbs}));
  shuffle(verbs).forEach(v=>out.push(blankIndex(VB[v])>=0?mk('fill',v):mk('conj',v)));
  shuffle(verbs).forEach(v=>out.push(mk('conj',v)));
  const kinds=['build','listenBuild','type'];
  shuffle(verbs).forEach((v,i)=>out.push(mk(kinds[i%3],v)));
  out.push(mk('speak',verbs[verbs.length-1]));
  return out;
}
function genPractice(){
  const L=learned().sort((a,b)=>(S.verbs[a].due-S.verbs[b].due)||(S.verbs[a].box-S.verbs[b].box));
  const pool=L.slice(0,Math.max(6,Math.min(L.length,12)));
  const picks=[];
  for(let i=0;i<10;i++)picks.push(pool[i%pool.length]);
  const kinds=['meaning','fill','conj','build','listenBuild','type'];
  const out=shuffle(picks).map((v,i)=>{
    let t=kinds[i%kinds.length];
    if(t==='fill'&&blankIndex(VB[v])<0)t='conj';
    return mk(t,v,{dir:i%2});
  });
  if(pool.length>=3)out.splice(5,0,mk('match',null,{verbs:shuffle(pool).slice(0,Math.min(4,pool.length))}));
  return out;
}
function distractJa(inf,key){
  const same=ALL.filter(x=>x!==inf&&VB[x].sec===VB[inf].sec),rest=ALL.filter(x=>x!==inf&&VB[x].sec!==VB[inf].sec);
  const out=[];
  for(const x of shuffle(same).concat(shuffle(rest))){const val=key==='ja'?VB[x].ja:x;if(val!==VB[inf][key==='ja'?'ja':'inf']&&!out.includes(val))out.push(val);if(out.length===3)break;}
  return out;
}
function otherForms(v,idx){
  const right=v.f[idx],out=[];
  for(const f of shuffle(v.f)){if(norm(f)!==norm(right)&&!out.some(o=>norm(o)===norm(f)))out.push(f);if(out.length===3)break;}
  return out;
}
function init(e){
  e.init=true;const v=e.v?VB[e.v]:null;
  if(e.type==='meaning'){
    e.correct=e.dir===0?v.ja:v.inf;
    e.opts=shuffle([e.correct].concat(distractJa(e.v,e.dir===0?'ja':'inf')));
  }
  if(e.type==='fill'){
    e.bi=blankIndex(v);e.toks=v.ex.split(' ');
    const w=core(e.toks[e.bi]);
    const idx=v.f.findIndex(f=>norm(f)===norm(w));
    e.correct=v.f[idx];e.opts=shuffle([e.correct].concat(otherForms(v,idx)));
  }
  if(e.type==='conj'){
    e.p=Math.floor(Math.random()*6);e.correct=v.f[e.p];e.opts=shuffle([e.correct].concat(otherForms(v,e.p)));
  }
  if(e.type==='build'||e.type==='listenBuild'){
    const toks=v.ex.split(' ').map(core),own=toks.map(norm);
    const extra=[];
    for(const x of shuffle(ALL.filter(a=>a!==e.v)))for(const t of VB[x].ex.split(' ').map(core)){
      if(!own.includes(norm(t))&&!extra.some(y=>norm(y)===norm(t))&&extra.length<2&&t.length>1){extra.push(t);}
      if(extra.length>=2)break;
    }
    e.tiles=shuffle(toks.concat(extra));e.built=[];
  }
  if(e.type==='type'){e.val='';}
  if(e.type==='match'){
    e.L=shuffle(e.verbs);e.R=shuffle(e.verbs);e.m=[];e.sl=null;e.sr=null;e.bad=null;
  }
}
const canCheck=e=>({meaning:e.sel!=null,fill:e.sel!=null,conj:e.sel!=null,build:e.built&&e.built.length>0,listenBuild:e.built&&e.built.length>0,type:!!(e.val&&e.val.trim()),speak:true,match:false}[e.type]);

function bubble(text,sub,audio){

}
function optHtml(e,list,right){
  return `<div class="opts">${list.map((o,i)=>{
    let c='opt';
    if(e.state!=='idle'){if(o===right)c+=' right';else if(e.sel===i)c+=' wrong';}
    else if(e.sel===i)c+=' sel';
    return `<button class="${c}" data-act="opt" data-v="${i}" ${e.state!=='idle'?'disabled':''}><span class="k">${i+1}</span><span>${esc(o)}</span></button>`;
  }).join('')}</div>`;
}
function vEx(){
  const e=cur(),n=sess.ex.length;
  if(!e.init)init(e);
  const v=e.v?VB[e.v]:null;
  const hearts=sess.mode==='lesson'?`<span class="pill heart">${I.heart}<span>${sess.hearts}</span></span>`:'';
  let body='';

    body=e.dir===0

      :`<div class="ask">イタリア語ではどれ？</div>${bubble(esc(v.ja),'',null)}${optHtml(e,e.opts,e.correct)}`;
  }
  if(e.type==='fill'){
    const before=e.toks.slice(0,e.bi).join(' '),after=e.toks.slice(e.bi+1).join(' ');
    const m=e.toks[e.bi].match(/^([A-Za-zÀ-ÿ']*)(.*)$/);
    const shown=e.sel!=null?e.opts[e.sel]:'';
    const sc=e.state==='idle'?'':(e.opts[e.sel]===e.correct?' right':' wrong');
    body=`<div class="ask">空所に合う形を選んでください</div>${bubble(esc(v.exJa),'',null)}
      <div class="sent">${esc(before)} <span class="slot${sc}">${esc(shown)||'&nbsp;'}</span>${esc(m?m[2]:'')} ${esc(after)}</div>${optHtml(e,e.opts,e.correct)}`;
  }
  if(e.type==='conj'){
    body=`<div class="ask">主語に合う形を選んでください</div>
      <div class="sent"><span class="pronoun">${PRON[e.p][0]}</span>${v.refl?CLITIC[e.p]+' ':''}<span class="slot${e.state==='idle'?'':(e.opts[e.sel]===e.correct?' right':' wrong')}">${e.sel!=null?esc(e.opts[e.sel]):'&nbsp;'}</span></div>
      <p class="cap" style="margin:-8px 0 16px">${PRON[e.p][1]}・${e.v}（${v.ja}）</p>${optHtml(e,e.opts,e.correct)}`;
  }
  if(e.type==='build'||e.type==='listenBuild'){
    const head=e.type==='build'
      ?`<div class="ask">イタリア語に訳してください</div>${bubble(esc(v.exJa),'',null)}`
      :`<div class="ask">聞こえた文を並べてください</div><div class="speak" style="display:flex;gap:14px;align-items:center;margin-bottom:18px"><button class="spk big" data-act="say" data-v="${esc(v.ex)}" aria-label="再生">${I.spk}</button><button class="btn sm" data-act="slow" data-v="${esc(v.ex)}">ゆっくり</button></div>`;
    body=`${head}<div class="ans">${e.built.map(i=>`<button class="tile" data-act="untile" data-v="${i}" ${e.state!=='idle'?'disabled':''}>${esc(e.tiles[i])}</button>`).join('')}</div>
      <div class="bank">${e.tiles.map((t,i)=>e.built.includes(i)?`<span class="tile ghost">${esc(t)}</span>`:`<button class="tile" data-act="tile" data-v="${i}" ${e.state!=='idle'?'disabled':''}>${esc(t)}</button>`).join('')}</div>`;

      <div class="col">${e.R.map((x,i)=>`<button class="opt ${e.m.includes(x)?'done':''} ${e.sr===i?'sel':''} ${e.bad&&e.bad[1]===i?'bad':''}" data-act="mr" data-v="${i}">${esc(VB[x].ja)}</button>`).join('')}</div></div>`;

function answerText(e){
  const v=e.v?VB[e.v]:null;
  if(e.type==='meaning')return e.dir===0?`${e.v} ＝ ${v.ja}`:`${v.ja} ＝ ${e.v}`;
  if(e.type==='fill'||e.type==='build'||e.type==='listenBuild'||e.type==='type')return v.ex;
  if(e.type==='conj')return `${PRON[e.p][0]} ${v.refl?CLITIC[e.p]+' ':''}${e.correct}`;
  return '';
}
function abar(e){
  if(e.state==='idle'){
    if(e.type==='match')return '';
    return `<div class="abar"><div class="in">${e.type==='speak'?`<button class="btn green full" data-act="check">言いました</button><button class="btn quiet full" data-act="skip">今は話せない</button>`
      :`<button class="btn full ${canCheck(e)?'green':'off'}" data-act="check" ${canCheck(e)?'':'disabled'}>確認</button>`}</div></div>`;
  }
  const ok=e.state==='right';
  const title=ok?pick(['正解です！','いいですね！','その調子！','Bravo!']):(sess.hearts<=0&&sess.mode==='lesson'?'ライフがなくなりました':'正解は…');
  const ans=ok?(e.type==='speak'?'この調子で、少しずつ。':e.type==='match'?'すべて組み合わせました。':''):answerText(e);
  const play=e.v&&e.type!=='match'?`<button class="spk" data-act="say" data-v="${esc(e.type==='conj'||e.type==='meaning'?(e.dir===1||e.type==='conj'?e.correct:e.v):VB[e.v].ex)}" aria-label="再生">${I.spk}</button>`:'';
  return `<div class="abar ${e.state}"><div class="in"><div class="fb"><span class="ic">${ok?I.check:I.cross}</span><div class="tx"><b>${title}</b>${ans?`<div>${esc(ans)}</div>`:''}</div>${play}</div>
    <button class="btn full ${ok?'green':'red'}" data-act="cont">続ける</button></div></div>`;
}

/* ---------- 判定 ---------- */
function resolve(e,ok){
  if(e.state!=='idle')return;
  e.state=ok?'right':'wrong';
  if(e.v){const r=sess.res[e.v];if(r===undefined)sess.res[e.v]=ok;else if(!ok)sess.res[e.v]=false;}
  if(!e.retry){if(ok)sess.right++;else sess.wrong++;}
  if(!ok){
    if(sess.mode==='lesson')sess.hearts--;
    if(!e.retry&&e.type!=='match'&&e.type!=='speak'){sess.ex.push(mk(e.type,e.v,{dir:e.dir?0:1,retry:true}));}
  }
  render();
  if(e.v&&e.type!=='match'){const v=VB[e.v];setTimeout(()=>say(e.type==='meaning'||e.type==='conj'?(e.type==='conj'?formShown(v,e.p):e.v):v.ex),120);}
}
function check(){
  const e=cur();if(e.state!=='idle')return;
  const v=e.v?VB[e.v]:null;
  if(e.type==='meaning'||e.type==='fill'||e.type==='conj'){if(e.sel==null)return;resolve(e,e.opts[e.sel]===e.correct);}
  else if(e.type==='build'||e.type==='listenBuild'){if(!e.built.length)return;resolve(e,norm(e.built.map(i=>e.tiles[i]).join(' '))===norm(v.ex));}
  else if(e.type==='type'){const a=$('#ans');e.val=a?a.value:e.val;if(!e.val.trim())return;resolve(e,norm(e.val)===norm(v.ex));}
  else if(e.type==='speak')resolve(e,true);
}
function cont(){
  const e=cur();if(e.state==='idle')return;
  if(sess.mode==='lesson'&&sess.hearts<=0&&e.state==='wrong'){go('fail');return;}
  sess.i++;
  if(sess.i>=sess.ex.length)finish();else{render();window.scrollTo(0,0);}
}
function finish(){
  const acc=sess.right+sess.wrong?Math.round(sess.right/(sess.right+sess.wrong)*100):100;
  sess.acc=acc;
  sess.xp=sess.mode==='lesson'?10+(sess.wrong===0?5:0):8;
  Object.keys(sess.res).forEach(v=>gradeVerb(v,sess.res[v]));
  const d=dayNum();S.days[d]=1;S.xp[d]=(S.xp[d]||0)+sess.xp;S.xpTotal+=sess.xp;
  if(sess.mode==='lesson'){const p=S.done[sess.k]||{n:0,best:0};S.done[sess.k]={n:p.n+1,best:Math.max(p.best,acc)};}
  save();go('done');
}
function vDone(){
  const next=sess.mode==='lesson'&&LESSONS[sess.k+1];
  return `<div class="center">${lumi()}<div class="big">${sess.mode==='lesson'?'レッスン完了！':'練習完了！'}</div>
   <div class="results"><div class="rc xp"><div class="h">XP</div><div class="v">${I.bolt}${sess.xp}</div></div>
   <div class="rc ac"><div class="h">正解率</div><div class="v">${sess.acc}%</div></div>
   <div class="rc st"><div class="h">連続</div><div class="v">${I.fire}${streak()}</div></div></div>
   <p class="cap">${xpToday()>=S.goal?`今日の目標 ${S.goal} XP を達成しました。`:`今日のXP：${xpToday()} / ${S.goal}`}${sess.wrong?'　間違えた動詞は近いうちに復習に出ます。':''}</p></div>
   <div class="bottom"><div class="in">${next?`<button class="btn green full" data-act="lesson" data-v="${sess.k+1}">次のレッスン</button><button class="btn full" data-act="tab" data-v="path">パスに戻る</button>`:`<button class="btn green full" data-act="tab" data-v="path">パスに戻る</button>`}</div></div>`;
}
function vFail(){
  return `<div class="center">${lumi()}<div class="big">ライフがなくなりました</div><p class="cap">焦らなくて大丈夫です。もう一度、少しずつ。<br>間違えた動詞は「動詞」タブで活用を確認できます。</p></div>
  <div class="bottom"><div class="in"><button class="btn green full" data-act="lesson" data-v="${sess.k}">もう一度挑戦</button><button class="btn full" data-act="tab" data-v="path">パスに戻る</button></div></div>`;
}

/* ================= 操作 ================= */
const ACT={
  tab(v){sess=null;go(v);},
  quit(){sess=null;go('path');},
  say(v){say(v,false);},
  slow(v){say(v,true);},
  guide(v){guideSec=+v;go('guide');},
  lesson(v){startLesson(+v);},
  begin(){sess.ex=genLesson(sess.verbs);sess.i=0;go('ex');},
  practice(){startPractice();},
  verb(v){vsel=v;go('verb');},
  filter(v){vfilter=v;render();},
  goal(v){S.goal=+v;save();render();},
  opt(v){const e=cur();if(e.state!=='idle')return;e.sel=+v;render();},
  tile(v){const e=cur();if(e.state!=='idle')return;e.built.push(+v);render();},
  untile(v){const e=cur();if(e.state!=='idle')return;e.built=e.built.filter(i=>i!==+v);render();},
  acc(v){const a=$('#ans');if(!a)return;const s=a.selectionStart==null?a.value.length:a.selectionStart,t=a.selectionEnd==null?s:a.selectionEnd;a.value=a.value.slice(0,s)+v+a.value.slice(t);cur().val=a.value;a.focus();a.setSelectionRange(s+1,s+1);},
  check(){check();},
  skip(){const e=cur();e.state='right';e.skipped=true;sess.i++;if(sess.i>=sess.ex.length)finish();else render();},
  cont(){cont();},
  ml(v){const e=cur();if(e.state!=='idle')return;e.sl=+v;matchTry(e);},
  mr(v){const e=cur();if(e.state!=='idle')return;e.sr=+v;matchTry(e);},
  askreset(){confirmReset=true;render();},
  noreset(){confirmReset=false;render();},
  reset(){S=defaults();save();confirmReset=false;go('path');}
};

function regTag(r) {

function phRow(p) {

function pairCard(q) {

   <div class="pl"><span class="rt f">フォーマル</span><b>${esc(q[1])}</b><button class="spk" data-act="say" data-v="${esc(q[1])}" aria-label="再生">${I.spk}</button></div>
   <div class="pl"><span class="rt i">友達</span><b>${esc(q[2])}</b><button class="spk" data-act="say" data-v="${esc(q[2])}" aria-label="再生">${I.spk}</button></div>
   <p class="cap">${esc(q[3])}</p></div>`;
}
function phList() {
  if (pcat === "pairs") return PAIRS.map(pairCard).join("");

  );
  return list.length
    ? list.map(phRow).join("")
    : '<p class="cap" style="text-align:center;padding:20px">見つかりませんでした</p>';
}

  ${pcat === "pairs" ? "" : `<div class="chips row" style="margin-top:0">${regs.map((c) => `<button class="chip ${preg === c[0] ? "on" : ""}" data-act="preg" data-v="${c[0]}">${c[1]}</button>`).join("")}</div>`}

/* ---- 表現クイズ ---- */
function phWeight(p) {
  const r = S.ph[p[2]];
  return r ? Math.max(0.4, 1 + r.ng * 2 - Math.min(r.ok, 4) * 0.3) : 2;
}
function pickWeighted(list, n) {
  const pool = list.slice(),
    out = [];
  while (out.length < n && pool.length) {
    const tot = pool.reduce((a, p) => a + phWeight(p), 0);
    let r = Math.random() * tot,
      i = 0;
    for (; i < pool.length; i++) {
      r -= phWeight(pool[i]);
      if (r <= 0) break;
    }
    out.push(pool.splice(Math.min(i, pool.length - 1), 1)[0]);
  }
  return out;
}
function phOpts(p, idx) {
  // 同じ場面を優先して紛らわしい選択肢を作る（同じ文は入れない）
  const same = PH.filter((x) => x !== p && x[0] === p[0]),
    rest = PH.filter((x) => x !== p && x[0] !== p[0]);
  const out = [],
    seen = { [p[idx]]: 1 };
  shuffle(same)
    .concat(shuffle(rest))
    .forEach((x) => {
      if (out.length < 3 && !seen[x[idx]]) {
        seen[x[idx]] = 1;
        out.push(x[idx]);
      }
    });
  return shuffle([p[idx]].concat(out));
}
function genPq() {
  const ps = pickWeighted(PH, 7),
    out = [];
  ps.forEach((p, i) => {
    if (i < 4)
      out.push({ type: "it2ja", p: p[2], opts: phOpts(p, 3), correct: p[3] });
    else
      out.push({ type: "ja2it", p: p[2], opts: phOpts(p, 2), correct: p[2] });
  });
  shuffle(PAIRS)
    .slice(0, 3)
    .forEach((q) => {
      const who = Math.random() < 0.5 ? "f" : "i";
      out.push({
        type: "pair",
        q,
        who,
        opts: shuffle([q[1], q[2]]),
        correct: who === "f" ? q[1] : q[2],
      });
    });
  return shuffle(out).map((e) =>
    Object.assign(e, { state: "idle", sel: null }),
  );
}
function startPq() {
  pq = { ex: genPq(), i: 0, right: 0, wrong: 0, xp: 0 };
  go("pq");
}
const pcur = () => pq.ex[pq.i];
function pOpt(e) {
  return `<div class="opts">${e.opts
    .map((o, i) => {
      let c = "opt";
      if (e.state !== "idle") {
        if (o === e.correct) c += " right";
        else if (e.sel === i) c += " wrong";
      } else if (e.sel === i) c += " sel";
      return `<button class="${c}" data-act="popt" data-v="${i}" ${e.state !== "idle" ? "disabled" : ""}><span class="k">${i + 1}</span><span>${esc(o)}</span></button>`;
    })
    .join("")}</div>`;
}
function vPq() {
  const e = pcur(),
    n = pq.ex.length;
  let body = "";
  if (e.type === "it2ja") {
    const p = PHM[e.p];
    body = `<div class="ask">どんな意味？</div>${bubble(esc(e.p), regTag(p[1]), e.p)}${pOpt(e)}`;
  }
  if (e.type === "ja2it") {
    const p = PHM[e.p];
    body = `<div class="ask">イタリア語ではどれ？</div>${bubble(esc(p[3]), "", null)}${pOpt(e)}`;
  }
  if (e.type === "pair") {
    body = `<div class="ask">${e.who === "f" ? "上司・初対面・店で言うなら？" : "友達に言うなら？"}</div>${bubble(esc(e.q[0]), "", null)}${pOpt(e)}`;
  }
  const ok = e.state === "right";
  const bar =
    e.state === "idle"
      ? `<div class="abar"><div class="in"><button class="btn full ${e.sel != null ? "green" : "off"}" data-act="pqcheck" ${e.sel != null ? "" : "disabled"}>確認</button></div></div>`
      : `<div class="abar ${e.state}"><div class="in"><div class="fb"><span class="ic">${ok ? I.check : I.cross}</span><div class="tx"><b>${ok ? pick(["正解です！", "いいですね！", "Bravo!"]) : "正解は…"}</b>${ok ? "" : `<div>${esc(e.correct)}</div>`}${pqNote(e)}</div><button class="spk" data-act="say" data-v="${esc(pqAudio(e))}" aria-label="再生">${I.spk}</button></div>
    <button class="btn full ${ok ? "green" : "red"}" data-act="pqcont">続ける</button></div></div>`;
  return `<div class="ltop"><button class="x" data-act="pqquit" aria-label="閉じる">×</button><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round((pq.i / n) * 100)}"><i style="width:${Math.max(4, Math.round((pq.i / n) * 100))}%"></i></div></div><div class="lbody">${body}</div>${bar}`;
}
function pqAudio(e) {
  return e.type === "pair" ? e.correct : e.p;
}
function pqNote(e) {
  const t = e.type === "pair" ? e.q[3] : PHM[e.p][4] || "";
  return t ? `<div style="font-weight:600;font-size:13px">${esc(t)}</div>` : "";
}
function pqCheck() {
  const e = pcur();
  if (e.state !== "idle" || e.sel == null) return;
  const ok = e.opts[e.sel] === e.correct;
  e.state = ok ? "right" : "wrong";
  if (e.type !== "pair") {
    const r = S.ph[e.p] || (S.ph[e.p] = { ok: 0, ng: 0 });
    if (ok) r.ok++;
    else r.ng++;
  }
  if (ok) pq.right++;
  else {
    pq.wrong++;
    if (!e.retry) {
      const c = Object.assign({}, e, {
        state: "idle",
        sel: null,
        retry: true,
        opts: shuffle(e.opts),
      });
      pq.ex.push(c);
    }
  }
  save();
  render();
  setTimeout(() => say(pqAudio(e)), 120);
}
function pqCont() {
  const e = pcur();
  if (e.state === "idle") return;
  pq.i++;
  if (pq.i >= pq.ex.length) pqFinish();
  else {
    render();
    window.scrollTo(0, 0);
  }
}
function pqFinish() {
  const total = pq.right + pq.wrong;
  pq.acc = total ? Math.round((pq.right / total) * 100) : 100;
  pq.xp = 6 + (pq.wrong === 0 ? 4 : 0);
  const d = dayNum();
  S.days[d] = 1;
  S.xp[d] = (S.xp[d] || 0) + pq.xp;
  S.xpTotal += pq.xp;
  save();
  go("pqdone");
}

   <div class="bottom"><div class="in"><button class="btn green full" data-act="pqstart">もう一度</button><button class="btn full" data-act="tab" data-v="phr">表現に戻る</button></div></div>`;
}

function matchTry(e){
  if(e.sl==null||e.sr==null){render();return;}
  const l=e.L[e.sl],r=e.R[e.sr];
  if(l===r){e.m.push(l);e.sl=e.sr=null;setTimeout(()=>say(l),80);
    if(e.m.length===e.verbs.length){resolve(e,sess.res[e.verbs[0]]!==false||true);return;}
    render();
  }else{
    e.bad=[e.sl,e.sr];e.sl=e.sr=null;
    sess.res[l]=false;sess.res[r]=false;
    if(sess.mode==='lesson')sess.hearts--;
    if(!e.missed){e.missed=true;if(!e.retry)sess.wrong++;}
    if(sess.hearts<=0&&sess.mode==='lesson'){e.state='wrong';e.bad=null;render();return;}
    render();
    setTimeout(()=>{if(cur()===e){e.bad=null;render();}},600);
  }
}
